# The Digitalku Flatpak remote. Sourced by every script in scripts/; any value
# can be overridden from the environment with the DKF_ prefix shown beside it.

# The name a user's `flatpak remotes` shows, and the one every .flatpakref
# suggests. Changing it after release leaves existing installs on the old name.
REMOTE_NAME=digitalku                                   # DKF_REMOTE_NAME
REMOTE_TITLE="Digitalku"
REMOTE_COMMENT="Applications from Digitalku"
REMOTE_DESCRIPTION="Linux applications published by Digitalku."
REMOTE_HOMEPAGE=https://digitalku.com
REMOTE_ICON=https://flatpak.digitalku.com/digitalku.svg

# Where public/ is served from. public/repo/ is the OSTree repository, and the
# .flatpakrepo and .flatpakref files sit beside it.
BASE_URL=https://flatpak.digitalku.com                  # DKF_BASE_URL

# The branch every application is published on.
BRANCH=stable                                           # DKF_BRANCH

# Runtimes come from Flathub; only the applications are ours.
RUNTIME_REPO=https://dl.flathub.org/repo/flathub.flatpakrepo

# The Cloudflare R2 bucket public/ is uploaded to, through the AWS CLI's S3
# API. The endpoint is https://<account-id>.r2.cloudflarestorage.com. The
# access key lives in ~/.aws/credentials under AWS_PROFILE_NAME, never here.
R2_BUCKET=digitalku-flatpak                             # DKF_R2_BUCKET
R2_ENDPOINT=                                            # DKF_R2_ENDPOINT
AWS_PROFILE_NAME=digitalku-r2                           # DKF_AWS_PROFILE

# The key that signs commits and the summary. Empty until the real key exists:
# see keys/README.md. A test key is made by scripts/test-key.sh.
GPG_KEY_ID=                                             # DKF_GPG_KEY_ID
GPG_HOMEDIR=                                            # DKF_GPG_HOMEDIR
